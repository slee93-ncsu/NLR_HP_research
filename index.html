<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html{color-scheme:light}
  body{margin:0; font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Texas Load Breakdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: instrument panel — map pane left, county table + detail right; stacks at phone width. */
:root{
  --bg:#eef1f5; --panel:#fbfcfd; --panel2:#f3f6f9; --fg:#121c26; --muted:#5d6b7a;
  --line:#d3dae3; --line2:#e3e9ef; --accent:#0e5e6e; --accent-fg:#ffffff;
  --nodata:#e2e7ed; --hot:#b8492a;
  --r0:#2f5d7c; --r1:#3d918d; --r2:#67a95b; --r3:#c8a128; --r4:#bd5029;
  --shadow:0 1px 2px rgba(18,28,38,.06), 0 8px 24px rgba(18,28,38,.05);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151c; --panel:#171f28; --panel2:#1d2630; --fg:#e7edf3; --muted:#95a3b2;
    --line:#2b3642; --line2:#222c37; --accent:#4fb3c4; --accent-fg:#06222a;
    --nodata:#222b35; --hot:#e07a4e;
    --r0:#4080ad; --r1:#49b3ae; --r2:#79cc72; --r3:#e5bf36; --r4:#e5733f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#171f28; --panel2:#1d2630; --fg:#e7edf3; --muted:#95a3b2;
  --line:#2b3642; --line2:#222c37; --accent:#4fb3c4; --accent-fg:#06222a;
  --nodata:#222b35; --hot:#e07a4e;
  --r0:#4080ad; --r1:#49b3ae; --r2:#79cc72; --r3:#e5bf36; --r4:#e5733f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); line-height:1.45;
  font-size:14px; -webkit-font-smoothing:antialiased}
.wrap{max-width:1360px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 48px}
h1{font-family:var(--f-display); font-weight:700; font-size:clamp(21px,3.2vw,30px);
  letter-spacing:-.015em; margin:0; text-wrap:balance}
.sub{color:var(--muted); margin:6px 0 0; max-width:64ch}
.sub b{color:var(--fg); font-weight:600}

/* ---- controls ---- */
.bar{display:flex; flex-wrap:wrap; gap:18px 26px; align-items:flex-end; margin-top:20px}
.field{display:flex; flex-direction:column; gap:7px; min-width:0}
.lab{font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted)}
.seg{display:flex; background:var(--panel2); border:1px solid var(--line);
  border-radius:9px; padding:3px; gap:2px; flex-wrap:wrap}
.seg button{font:inherit; font-size:12.5px; border:0; background:transparent; color:var(--muted);
  padding:6px 11px; border-radius:6px; cursor:pointer; white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); font-weight:600}
.seg button:disabled{opacity:.4; cursor:default}
.seg button:disabled:hover{color:var(--muted)}
select{font:inherit; font-size:13px; background:var(--panel); color:var(--fg);
  border:1px solid var(--line); border-radius:9px; padding:8px 10px; max-width:100%}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible,th button:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px}

/* ---- stat strip ---- */
.stats{display:flex; flex-wrap:wrap; gap:0 34px; margin-top:22px; padding-top:16px;
  border-top:1px solid var(--line)}
.stat{display:flex; flex-direction:column; gap:1px; padding-block:4px}
.stat .k{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.stat .v{font-family:var(--f-mono); font-size:17px; font-weight:500;
  font-variant-numeric:tabular-nums}

/* ---- panes ---- */
.grid{display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);
  gap:18px; margin-top:20px; align-items:start}
.pane{background:var(--panel); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); min-width:0}
.pane-h{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  padding:14px 16px; border-bottom:1px solid var(--line2); flex-wrap:wrap}
.pane-h h2{font-family:var(--f-display); font-weight:600; font-size:14px; margin:0;
  letter-spacing:.005em}
.pane-h .note{font-size:11.5px; color:var(--muted)}

/* ---- map ---- */
.mapbox{position:relative; padding:10px 12px 4px}
svg.map{display:block; width:100%; height:auto; max-width:100%; overflow:visible}
svg.map path{stroke:var(--panel); stroke-width:1.1; vector-effect:non-scaling-stroke}
svg.map path.on{cursor:pointer}
svg.map path.on:hover{stroke:var(--fg); stroke-width:1.8}
svg.map path.off,svg.map path.dim{fill:var(--nodata); stroke:var(--line); stroke-width:.8}
svg.map path.flag{stroke:var(--line); stroke-width:.9; cursor:help}
svg.map path.flag.missing{stroke:var(--hot); stroke-width:1.6}
svg.map .hatch-a{stroke:var(--muted)}
svg.map .hatch-b{stroke:var(--hot)}
svg.map .hatch-bg{fill:var(--nodata)}
svg.map path.dim{cursor:default}
svg.map path.sel{stroke:var(--fg); stroke-width:2.6}
svg.map path:focus-visible{outline:none; stroke:var(--fg); stroke-width:2.6}
svg.map .cityg circle{fill:var(--fg); stroke:var(--panel); stroke-width:1.6}
svg.map .cityg text{font-family:var(--f-body); font-size:17px; font-weight:600;
  fill:var(--fg); stroke:var(--panel); stroke-width:3.2px; paint-order:stroke;
  letter-spacing:.01em}
svg.map .cityg{pointer-events:none}
.toggle{display:inline-flex; align-items:center; gap:6px; font-size:11.5px;
  color:var(--muted); cursor:pointer}
.toggle input{accent-color:var(--accent); margin:0}
.tip{position:absolute; pointer-events:none; z-index:5; background:var(--panel);
  border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow);
  padding:7px 10px; font-size:12px; white-space:nowrap; transform:translate(-50%,-115%)}
.tip .t{font-weight:600}
.tip .n{font-family:var(--f-mono); color:var(--muted); font-variant-numeric:tabular-nums}
.legend{display:flex; align-items:center; gap:10px; padding:4px 16px 16px; flex-wrap:wrap}
.legend .keys{display:flex; gap:16px 20px; flex:1 0 100%; flex-wrap:wrap; margin-top:2px}
.legend .key{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted)}
.legend .key i{width:13px; height:13px; border-radius:3px; border:1px solid var(--line);
  flex:none}
.key i.k-nomodel{background:repeating-linear-gradient(45deg,
  var(--nodata) 0 4px, var(--muted) 4px 6px)}
.key i.k-missing{background:repeating-linear-gradient(45deg,
  var(--nodata) 0 4px, var(--hot) 4px 6px); border-color:var(--hot)}
.ramp{height:9px; border-radius:5px; flex:1 1 140px; min-width:120px;
  background:linear-gradient(90deg,var(--r0),var(--r1),var(--r2),var(--r3),var(--r4))}
.legend .e{font-family:var(--f-mono); font-size:11.5px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.legend .cap{font-size:11.5px; color:var(--muted); flex:1 0 100%}

/* ---- county detail ---- */
.det{padding:14px 16px 16px}
.det .hd{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  flex-wrap:wrap}
.det .name{font-family:var(--f-display); font-weight:700; font-size:19px; letter-spacing:-.01em}
.det .peak{font-family:var(--f-mono); font-size:12px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.det .peak b{color:var(--hot); font-weight:500}
.kv{display:flex; flex-wrap:wrap; gap:4px 22px; margin:10px 0 14px}
.kv div{display:flex; flex-direction:column}
.kv .k{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.kv .v{font-family:var(--f-mono); font-size:13.5px; font-variant-numeric:tabular-nums}
.uses{overflow:visible; display:flex; flex-direction:column;
  margin:0; padding:0; list-style:none}
.uses li{display:grid; grid-template-columns:minmax(0,1fr) 52px 98px; gap:8px;
  align-items:center; padding:7px 2px 8px; border-bottom:1px solid var(--line2)}
.uses li.cur{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.uses li.grp .u{font-weight:600}
.uses .mem{grid-column:1/-1; font-size:11px; line-height:1.55; color:var(--muted);
  margin:3px 0 1px}
.uses .u{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12.5px}
.uses .bar{grid-column:1/-1; height:3px; border-radius:2px; background:var(--line2);
  overflow:hidden; margin-top:-1px}
.uses .bar i{display:block; height:100%; border-radius:3px}
.uses .p,.uses .e{font-family:var(--f-mono); font-size:12px; text-align:right;
  font-variant-numeric:tabular-nums}
.uses .e{color:var(--muted)}
.empty{color:var(--muted); font-size:13px; padding:8px 0 2px}
footer{margin-top:26px; padding-top:14px; border-top:1px solid var(--line);
  color:var(--muted); font-size:12px; max-width:76ch}
footer code{font-family:var(--f-mono); font-size:11.5px}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  svg.map path{transition:fill .18s ease}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Texas Load Breakdown</h1>
  </header>

  <div class="bar">
    <div class="field">
      <span class="lab" id="lab-zone">Climate zone</span>
      <div class="seg" id="seg-zone" role="group" aria-labelledby="lab-zone"></div>
    </div>
    <div class="field" hidden>
      <span class="lab" id="lab-period">Period</span>
      <div class="seg" id="seg-period" role="group" aria-labelledby="lab-period"></div>
    </div>
    <div class="field">
      <span class="lab" id="lab-metric">Shade by</span>
      <div class="seg" id="seg-metric" role="group" aria-labelledby="lab-metric">
        <button type="button" data-v="share">Share of energy</button>
        <button type="button" data-v="per">kWh per building</button>
      </div>
    </div>
    <div class="field">
      <label class="lab" for="sel-use">End use</label>
      <select id="sel-use"></select>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <section class="pane">
      <div class="pane-h">
        <h2 id="map-title">Texas counties</h2>
        <span class="note" id="map-note"></span>
        <label class="toggle" for="cities">
          <input type="checkbox" id="cities" checked> City labels</label>
      </div>
      <div class="mapbox" id="mapbox"></div>
      <div class="legend">
        <span class="e" id="leg-lo">0</span>
        <span class="ramp" aria-hidden="true"></span>
        <span class="e" id="leg-hi">max</span>
        <span class="cap" id="leg-cap"></span>
        <span class="keys">
          <span class="key"><i class="k-nomodel"></i>No model to run — Loving, Glasscock</span>
          <span class="key"><i class="k-missing"></i>Not simulated — Val Verde</span>
        </span>
      </div>
    </section>

    <div style="display:flex; flex-direction:column; gap:18px; min-width:0">
      <section class="pane">
        <div class="pane-h">
          <h2>County summary</h2>
          <span class="note" id="det-note">Click a county on the map or a row below</span>
        </div>
        <div class="det" id="det"></div>
      </section>
    </div>
  </div>

</div>

      g2.appendChild(x);
    });
    selUse.appendChild(g2);
  })();
  selUse.addEventListener("change", function(){ state.use = selUse.value; render(); });

  /* ---------- render ---------- */
  function render(){
    readRamp();
    counties = all.filter(inZone);
    if(state.county && counties.indexOf(state.county) < 0) state.county = null;

    Array.prototype.forEach.call(segZ.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", b.dataset.v === state.zone);
    });
    Array.prototype.forEach.call(segP.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", b.dataset.v === state.period);
    });
    Array.prototype.forEach.call(
      document.querySelectorAll("#seg-metric button"), function(b){
        b.setAttribute("aria-pressed", b.dataset.v === state.metric);
        b.disabled = (state.use === TOTAL && b.dataset.v === "share");
      });
    selUse.value = state.use;

    var vals = counties.map(function(c){ return value(c); })
                       .filter(function(v){ return v !== null; });
    var hi = vals.length ? Math.max.apply(null, vals) : 1;
    if(hi <= 0) hi = 1;

    Object.keys(FLAG).forEach(function(c){
      var p = flagPaths[c]; if(!p) return;
      var on = (state.zone === "all" || FLAG[c].z === state.zone);
      p.setAttribute("class", on ? "flag " + FLAG[c].k : "dim");
      if(on) p.setAttribute("fill", FLAG[c].k === "missing"
                                      ? "url(#hatchB)" : "url(#hatchA)");
      else p.removeAttribute("fill");
    });

    all.forEach(function(c){
      var p = paths[c]; if(!p) return;
      if(!inZone(c)){
        p.setAttribute("class", "dim");
        p.removeAttribute("fill");
        p.setAttribute("aria-label", c + " County, zone " + T.meta[c].z + ", filtered out");
        return;
      }
      var v = value(c);
      p.setAttribute("fill", v === null ? "var(--nodata)" : color(v/hi));
      p.setAttribute("class", "on" + (state.county === c ? " sel" : ""));
      p.setAttribute("aria-label", c + " County, " + useLabel(state.use) + " " + fmtVal(v));
      if(state.county === c) p.parentNode.appendChild(p);   // bring stroke to front
    });

    document.getElementById("leg-lo").textContent = perBuilding() ? "0" : "0%";
    document.getElementById("leg-hi").textContent = fmtVal(hi);
    document.getElementById("leg-cap").textContent =
      (perBuilding()
        ? useLabel(state.use) + ", kWh per modeled building"
        : useLabel(state.use) + " as a share of that county's total energy")
      + " · " + (P_LABEL[state.period] || state.period);
    document.getElementById("map-note").textContent =
      useLabel(state.use) + " · " + (P_LABEL[state.period] || state.period)
      + (state.zone === "all" ? "" : " · zone " + state.zone);

    var nb = counties.reduce(function(s,c){ return s + T.meta[c].nb; }, 0);
    var e  = counties.reduce(function(s,c){ var r = rec(c); return s + (r ? r.e : 0); }, 0);
    var sel = counties.reduce(function(s,c){
      var v = energyOf(c, state.use); return s + (v || 0); }, 0);
    document.getElementById("stats").innerHTML = [
      ["Counties", counties.length + (state.zone === "all" ? "" : " in " + state.zone)],
      ["Modeled buildings", num(nb)],
      [(P_LABEL[state.period] || "") + " energy", num(e/1000,1) + " MWh"],
      ["Per building", num(nb ? e/nb : 0) + " kWh"],
      [useLabel(state.use), (state.use === TOTAL ? "100%"
        : (e ? (sel/e*100).toFixed(1) + "%" : "–"))]
    ].map(function(s){
      return '<div class="stat"><span class="k">' + s[0] + '</span>'
           + '<span class="v">' + s[1] + "</span></div>";
    }).join("");

    renderDetail();
  }

  function renderDetail(){
    var det = document.getElementById("det");
    var c = state.county;
    if(!c){
      c = counties.slice().sort(function(a,b){
        return T.meta[b].nb - T.meta[a].nb; })[0];
      document.getElementById("det-note").textContent =
        "showing " + c + ", the largest sample — click any county to switch";
    }else{
      document.getElementById("det-note").textContent =
        "click the county again to go back to the default";
    }
    var r = rec(c);
    if(!r){ det.innerHTML = '<p class="empty">No data for this period.</p>'; return; }
    var nb = T.meta[c].nb;

    var list = GROUP_NAMES.map(function(g){
      return {g:g, e:energyOf(c,g), s:r.e ? energyOf(c,g)/r.e : 0};
    }).sort(function(a,b){ return b.e - a.e; });
    var top = list[0].s || 1;

    det.innerHTML =
      '<div class="hd"><span class="name">' + c + " County</span>"
      + '<span class="peak">zone ' + T.meta[c].z + " · " + num(nb)
      + (nb === 1 ? " model" : " models") + "</span></div>"
      + '<div class="kv">'
      + kv(P_LABEL[state.period] + " energy", num(r.e) + " kWh")
      + kv("Per building", num(r.e/nb) + " kWh")
      + "</div>"
      + '<ul class="uses">' + list.map(function(x){
          var mem = MEMBERS[x.g];
          var sub = "";
          if(mem.length > 1){
            sub = '<span class="mem">' + mem.map(function(u){
              var ue = r.u[u] ? r.u[u][0] : 0;
              return u + " " + (r.e ? (ue/r.e*100).toFixed(1) : "0") + "%";
            }).join(" · ") + "</span>";
          }
          return '<li class="grp' + (x.g === state.use ? " cur" : "") + '">'
            + '<span class="u">' + x.g + "</span>"
            + '<span class="p">' + (x.s*100).toFixed(x.s < 0.01 ? 2 : 1) + "%</span>"
            + '<span class="e">' + num(x.e/nb) + " kWh/bl</span>"
            + '<span class="bar"><i style="width:' + (x.s/top*100).toFixed(1)
            + '%; background:' + color(x.s/top) + '"></i></span>'
            + sub + "</li>";
        }).join("") + "</ul>";
  }
  function kv(k,v){
    return "<div><span class=\"k\">" + k + "</span><span class=\"v\">" + v + "</span></div>";
  }

  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener) mq.addEventListener("change", render);
  new MutationObserver(render).observe(document.documentElement,
    {attributes:true, attributeFilter:["data-theme"]});

  render();
})();
</script>

</body>
</html>
